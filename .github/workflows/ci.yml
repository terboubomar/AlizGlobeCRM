name: CRM checks
on: [push, pull_request]

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

# Cancel superseded runs on feature branches; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aliz
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: aliz
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U aliz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm audit --audit-level=high
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  # Photo storage and malware scanning against real services: an
  # S3-compatible store (SeaweedFS) and ClamAV, both pinned by digest.
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: aliz-ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-only-not-a-secret
      S3_FORCE_PATH_STYLE: 'true'
      MALWARE_SCANNER: tcp://127.0.0.1:3310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start object storage and ClamAV
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e server -s3 -dir=/data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for both services
        run: |
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:8333/ && printf 'zPING\0' | timeout 2 nc 127.0.0.1 3310 | grep -q PONG && exit 0
            sleep 2
          done
          docker logs clamav | tail -20
          exit 1
      - run: npm run test:services

  # Builds every image and boots the demo stack the way docker-compose.yml
  # describes it, so container changes are proven before they merge.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 0.69.4 was a malicious release (CVE-2026-33634); 0.69.3 is known safe.
      # Change version and checksum together, from the release's checksums file.
      TRIVY_VERSION: 0.69.3
      TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure demo environment
        run: |
          cp .env.example .env
          sed -i "s/^PII_KEY=.*/PII_KEY=$(openssl rand -hex 32)/; s/^PHONE_HASH_KEY=.*/PHONE_HASH_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images and start the stack
        run: docker compose --profile app up --build --detach
      - name: Smoke test web, API proxy and worker
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
          test "$(docker compose ps --status running --format '{{.Service}}' worker)" = worker
          test "$(docker compose ps --all --format '{{.ExitCode}}' setup)" = 0
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i aliz
      - name: Install Trivy (checksum-verified)
        run: |
          curl -sSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
      # The images that ship: API/worker (server target) and web. Fails on
      # high or critical vulnerabilities that have a fix available; accepted
      # exceptions go in .trivyignore with a reason and a review date.
      - name: Scan shipped images for known vulnerabilities
        run: |
          images=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E 'aliz[^/]*-(api|web):' | sort -u)
          test "$(echo "$images" | wc -l)" = 2
          for image in $images; do
            echo "::group::$image"
            ./trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --ignorefile .trivyignore --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down --volumes
