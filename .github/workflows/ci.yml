name: CRM checks
on: [push, pull_request]

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

# Cancel superseded runs on feature branches; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aliz
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: aliz
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U aliz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm audit --audit-level=high
      - run: npm run test:integration
      # pg_dump/pg_restore from the same Postgres major as the server.
      - run: npm run backup:rehearse
        env:
          PG_TOOLS_IMAGE: postgres:17-alpine
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Rollback rehearsal: the base branch's API (the release being replaced)
  # must still work after this branch's migrations run, so an image
  # rollback never needs a database rollback.
  rollback:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aliz
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: aliz
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U aliz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_MODE: 'true'
      SEED_DEMO_USERS: 'true'
      SEED_DEMO_CASES: 'true'
      API_PORT: '4000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Shared test keys
        run: |
          for k in PII_KEY PHONE_HASH_KEY AUTH_SESSION_KEY; do echo "$k=$(openssl rand -hex 32)" >> "$GITHUB_ENV"; done
      - name: Migrate and seed with this branch
        working-directory: head
        run: |
          npm ci
          cp .env.example .env
          npm run db:generate
          npm run db:migrate
          npm run db:seed:demo
      - name: Start the base branch's API on the migrated database
        working-directory: base
        run: |
          npm ci
          cp .env.example .env
          npm run db:generate
          nohup npx tsx apps/api/src/main.ts > ../base-api.log 2>&1 &
      - name: Previous release still serves cases
        working-directory: head
        run: npx tsx scripts/rollback-smoke.ts
      - name: Base API log on failure
        if: failure()
        run: tail -50 base-api.log

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  # Builds every image and boots the demo stack the way docker-compose.yml
  # describes it, so container changes are proven before they merge.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 0.69.4 was a malicious release (CVE-2026-33634); 0.69.3 is known safe.
      # Change version and checksum together, from the release's checksums file.
      TRIVY_VERSION: 0.69.3
      TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure demo environment
        run: |
          cp .env.example .env
          sed -i "s/^PII_KEY=.*/PII_KEY=$(openssl rand -hex 32)/; s/^PHONE_HASH_KEY=.*/PHONE_HASH_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images and start the stack
        run: docker compose --profile app up --build --detach
      - name: Smoke test web, API proxy and worker
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
          test "$(docker compose ps --status running --format '{{.Service}}' worker)" = worker
          test "$(docker compose ps --all --format '{{.ExitCode}}' setup)" = 0
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i aliz
      - name: Install Trivy (checksum-verified)
        run: |
          curl -sSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
      # The images that ship: API/worker (server target) and web. Fails on
      # high or critical vulnerabilities that have a fix available; accepted
      # exceptions go in .trivyignore with a reason and a review date.
      - name: Scan shipped images for known vulnerabilities
        run: |
          images=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E 'aliz[^/]*-(api|web):' | sort -u)
          test "$(echo "$images" | wc -l)" = 2
          for image in $images; do
            echo "::group::$image"
            ./trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --ignorefile .trivyignore --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down --volumes
